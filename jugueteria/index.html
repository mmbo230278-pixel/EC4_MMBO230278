<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juguetería · Peso del paquete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="tema-jugueteria">
    <header class="encabezado">
        <img src="img/logo.svg" alt="Logo">
        <h1>Juguetería · Peso del paquete</h1>
    </header>
    <main class="contenedor"><div class="tarjeta">
        <h2>Calcula el peso del paquete</h2>
        <div class="ilustracion mb-3">
            <figure class="d-inline-block"><img src="img/payaso.svg" alt="Payaso"><figcaption>Payaso · 112 g</figcaption></figure>
            <figure class="d-inline-block"><img src="img/muneca.svg" alt="Muñeca"><figcaption>Muñeca · 104 g</figcaption></figure>
        </div>
        <form action="php/procesar.php" method="post" novalidate>
            <table class="table table-bordered table-striped align-middle">
                <tbody>
                    <tr><th scope="row" style="width:45%"><label for="npayasos">Payasos vendidos en el último pedido</label></th>
                        <td><input type="text" class="form-control" id="npayasos" name="npayasos" data-tipo="entero" data-min="0" data-max="10000" placeholder="Ej. 12">
                            <div class="invalid-feedback"></div></td></tr>
                    <tr><th scope="row"><label for="nmunecas">Muñecas vendidas en el último pedido</label></th>
                        <td><input type="text" class="form-control" id="nmunecas" name="nmunecas" data-tipo="entero" data-min="0" data-max="10000" placeholder="Ej. 8">
                            <div class="invalid-feedback"></div></td></tr>
                </tbody>
            </table>
            <div class="text-center"><button type="submit" class="btn btn-principal btn-lg" onclick="return validar()">Calcular peso</button></div>
        </form>
        <a class="volver" href="../index.html">&larr; Volver al men&uacute;</a>
    </div></main>
    <script src="../js/validaciones.js"></script>
</body>
</html>
