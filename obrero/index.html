<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salario semanal del obrero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="tema-obrero">
    <header class="encabezado">
        <img src="img/logo.svg" alt="Logo">
        <h1>Salario semanal del obrero</h1>
    </header>
    <main class="contenedor"><div class="tarjeta">
        <h2>Calcula tu salario semanal</h2>
        <p class="text-center">Hasta 40 horas se pagan a <b>$16</b> por hora. Cada hora extra se paga a <b>$20</b>.</p>
        <form action="php/procesar.php" method="post" novalidate>
            <table class="table table-bordered table-striped align-middle">
                <tbody>
                    <tr><th scope="row" style="width:35%"><label for="nombre">Nombre completo del trabajador</label></th>
                        <td><input type="text" class="form-control" id="nombre" name="nombre" data-tipo="texto" placeholder="Nombre completo">
                            <div class="invalid-feedback"></div></td></tr>
                    <tr><th scope="row"><label for="horas">Horas trabajadas en la semana</label></th>
                        <td><input type="text" class="form-control" id="horas" name="horas" data-tipo="decimal" data-min="1" data-max="100" placeholder="Ej. 45">
                            <div class="invalid-feedback"></div></td></tr>
                </tbody>
            </table>
            <div class="text-center"><button type="submit" class="btn btn-principal btn-lg" onclick="return validar()">Generar recibo de pago</button></div>
        </form>
        <a class="volver" href="../index.html">&larr; Volver al men&uacute;</a>
    </div></main>
    <script src="../js/validaciones.js"></script>
</body>
</html>
