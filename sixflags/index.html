<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Six Flags Morelos · Boletos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="tema-sixflags">
    <header class="encabezado">
        <img src="img/logo.svg" alt="Logo">
        <h1>Six Flags Morelos · Boletos</h1>
    </header>
    <main class="contenedor"><div class="tarjeta">
        <h2>Cobro de boletos · Parque acuático</h2>
        <p class="text-center">Pregunta al visitante si cuenta con membresía. Sin membresía el boleto cuesta <b>$2,673.00</b>.</p>
        <form action="php/procesar.php" method="post" novalidate>
            <!-- El formulario se presenta con una tabla de Bootstrap -->
            <table class="table table-bordered table-striped align-middle">
                <tbody>
                    <tr>
                        <th scope="row" style="width:35%"><label for="nombre">Nombre del visitante</label></th>
                        <td><input type="text" class="form-control" id="nombre" name="nombre" data-tipo="texto" placeholder="Nombre completo">
                            <div class="invalid-feedback"></div></td>
                    </tr>
                    <tr>
                        <th scope="row"><label for="boletos">Cantidad de boletos</label></th>
                        <td><input type="text" class="form-control" id="boletos" name="boletos" data-tipo="entero" data-min="1" data-max="100" placeholder="Ej. 3">
                            <div class="invalid-feedback"></div></td>
                    </tr>
                    <tr>
                        <th scope="row"><label for="membresia">¿Tiene membresía?</label></th>
                        <td><select class="form-select" id="membresia" name="membresia" data-tipo="lista">
                                <option value="">Selecciona…</option>
                                <option value="ninguna">No tiene (precio normal)</option>
                                <option value="plata">Plata · 25% de descuento</option>
                                <option value="oro">Oro · 50% de descuento</option>
                                <option value="platino">Platino · 65% de descuento</option>
                            </select>
                            <div class="invalid-feedback"></div></td>
                    </tr>
                </tbody>
            </table>
            <div class="text-center"><button type="submit" class="btn btn-principal btn-lg" onclick="return validar()">Cobrar y generar ticket</button></div>
        </form>
        <a class="volver" href="../index.html">&larr; Volver al men&uacute;</a>
    </div></main>
    <script src="../js/validaciones.js"></script>
</body>
</html>
